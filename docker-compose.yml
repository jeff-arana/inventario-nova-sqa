services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_only}
      MYSQL_DATABASE: inventario_nova
      MYSQL_USER: nova_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_change_me}
    ports: ["3307:3306"]
    volumes:
      - nova_mysql:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: nova_user
      DB_PASSWORD: ${MYSQL_PASSWORD:-local_change_me}
      DB_NAME: inventario_nova
      CORS_ORIGIN: http://localhost:8080
    ports: ["3001:3001"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]
volumes:
  nova_mysql:
